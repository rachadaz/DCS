[source]
# Dossier source OneDrive (accessible avec le compte standard rachad.yazough)
path = C:\Users\rachad.yazough\OneDrive - VINCI Energies\Documents\DSC

[destination]
# Share reseau (accessible avec le compte admin rachad.yazough_adm)
path = \\fr003-pkg-003.dom1.vinci-energies.net\01-Sources\_2026\DCS

[options]
# Extensions de fichiers a copier (separees par des virgules, vide = tous les fichiers)
extensions =

# Supprimer les fichiers source apres copie reussie (true/false)
delete_after_copy = false

# Copier uniquement les fichiers plus recents (true/false)
# Si true : ne copie que si le fichier source est plus recent ou n'existe pas en destination
# Si false : copie tout a chaque execution
incremental = true

[logging]
log_level = INFO
log_file = C:\ProgramData\dcs-workflow\dcs_copy.log
